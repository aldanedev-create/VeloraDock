name: Test and package VeloraDock
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: aldanedev-create/flaxon
          path: vendor/flaxon
      - uses: actions/checkout@v4
        with:
          repository: aldanedev-create/teloce-py
          path: vendor/teloce
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source frameworks and published MinifyJS
        run: |
          python -m pip install --upgrade pip
          python -m pip install minifyjs==0.1.3 pyyaml "tree-sitter>=0.26,<0.27" "tree-sitter-javascript>=0.25,<0.26" "tree-sitter-typescript>=0.23,<0.24" uvicorn pywebview pystray Pillow psutil pyinstaller pytest playwright
          python -m pip install -e vendor/teloce -e vendor/flaxon -e . --no-deps
          python -m pip freeze > build-environment.txt
      - name: Test providers and application
        run: python -m pytest tests -q
      - name: Browser interaction test
        env:
          VELORA_BROWSER_TESTS: '1'
        run: |
          python -m playwright install chromium
          python -m pytest tests/test_browser.py -q
      - name: Search benchmark
        run: python tools/benchmark.py --out benchmark-results.json
      - name: Build frozen desktop and MSIX
        shell: pwsh
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
        run: |
          $parameters = @{}
          if ($env:STORE_IDENTITY_NAME) { $parameters.IdentityName = $env:STORE_IDENTITY_NAME }
          if ($env:STORE_PUBLISHER) { $parameters.Publisher = $env:STORE_PUBLISHER }
          ./packaging/build_msix.ps1 @parameters
      - uses: actions/upload-artifact@v4
        with:
          name: VeloraDock-Windows-x64
          path: |
            dist/VeloraDock.msix
            dist/VeloraDock/**
            benchmark-results.json
            build-environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VeloraDock-diagnostics
          path: |
            build/browser-workspace.png
            build/native-smoke.json
            build/native-smoke-data/startup.log
