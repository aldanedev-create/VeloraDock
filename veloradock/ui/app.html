<template>
  <main>
    <header>
      <div><img class="brand" src="/assets/logo.svg" alt=""><strong>VeloraDock</strong><small> Your local command space</small></div>
      <button @click="settings = !settings">{{ settings ? 'Back to search' : 'Settings' }}</button>
    </header>
    <WorldScene @destination="visit" />
    <section v-if="!settings" class="search-area">
      <label for="search-box">What would you like to do?</label>
      <input id="search-box" v-model="query" @keydown="onKey" placeholder="Search apps, files, actions… or type 12 km to mi" autocomplete="off">
      <p class="hint">app · file · run · clip · = 2 * (3 + 4)</p>
      <p role="status">{{ message }}</p>
      <div role="listbox" aria-label="Search results">
        <button v-for="(result, index) in results" :key="result.id" class="result" :class="{ selected: index === selected }" role="option" :aria-selected="index === selected" @click="activate(result)">
          <span class="kind">{{ result.kind }}</span>
          <span><strong>{{ result.title }}</strong><small>{{ result.subtitle }}</small></span>
          <span>↵</span>
        </button>
      </div>
      <p v-if="results.length === 0 && !busy" class="empty">No matching results. Add a folder or action in Settings.</p>
      <footer>↑ ↓ select · Enter open · Alt+Enter reveal file · Esc hide <span>{{ elapsed }} ms server search</span></footer>
    </section>
    <SettingsPanel v-if="settings" :token="token" />
    <section v-if="pending" class="confirmation" role="dialog" aria-modal="true" aria-label="Run registered action">
      <h2>Run this registered action?</h2><p>{{ pending.title }}</p><p>{{ pending.subtitle }}</p>
      <p>The action runs with your Windows account permissions. Only run files you trust.</p>
      <button @click="confirmAction">Run action</button><button @click="pending = null">Cancel</button>
    </section>
  </main>
</template>
<script lang="ts">
import WorldScene from "./components/WorldScene.html";
import SettingsPanel from "./components/SettingsPanel.html";
import { request, native } from "./api.ts";
import type { Result, SearchResponse } from "./types.ts";

export default {
  props: ["token"],
  components: { SettingsPanel, WorldScene },
  data() {
    const results: Result[] = [];
    return { query: "", results, selected: 0, settings: false, message: "Ready", busy: false, elapsed: 0, pending: null, _timer: null, _sequence: 0 };
  },
  watch: {
    query() {
      clearTimeout(this._timer);
      // Invalidate an older response as soon as the query changes.
      this._sequence++;
      this._timer = setTimeout(() => this.search(), 90);
    },
  },
  methods: {
    visit(query: string) { this.settings = false; this.query = query; requestAnimationFrame(() => (document.querySelector("#search-box") as HTMLInputElement)?.focus()); },
    async search() {
      const sequence = ++this._sequence;
      this.busy = true;
      const started: number = performance.now();
      try {
        const data: SearchResponse = await request("/api/search", this.token, { query: this.query });
        if (sequence !== this._sequence) return;
        this.results = data.items;
        this.selected = 0;
        this.elapsed = data.elapsed_ms;
        this.message = `${this.results.length} results`;
        request("/api/metric", this.token, { kind: "search_roundtrip", duration_ms: performance.now() - started }).catch(() => {});
      } catch (error) {
        if (sequence === this._sequence) this.message = String(error);
      } finally {
        if (sequence === this._sequence) this.busy = false;
      }
    },
    onKey(event: KeyboardEvent) {
      if (event.key === "ArrowDown") {
        event.preventDefault();
        this.selected = Math.min(this.results.length - 1, this.selected + 1);
      } else if (event.key === "ArrowUp") {
        event.preventDefault();
        this.selected = Math.max(0, this.selected - 1);
      } else if (event.key === "Enter") {
        event.preventDefault();
        if (this.results[this.selected]) {
          if (event.altKey && this.results[this.selected].kind === "file" && native()) {
            native().reveal_file(this.results[this.selected].id).then(reply => { this.message = reply.error || reply.message; });
          } else this.activate(this.results[this.selected]);
        }
      } else if (event.key === "Escape") {
        if (this.pending) this.pending = null;
        else if (native()) native().hide();
      }
    },
    async activate(result: Result) {
      if (result.confirm) {
        this.pending = result;
        return;
      }
      await this.execute(result, false);
    },
    async execute(result: Result, confirmed: boolean) {
      const bridge = native();
      if (!bridge) {
        this.message = "Opening files, scripts and clipboard requires the Windows desktop app.";
        return;
      }
      const reply = await bridge.execute(result.id, confirmed);
      this.message = reply.error || reply.message || "Done";
    },
    async confirmAction() {
      const result = this.pending;
      this.pending = null;
      if (result) await this.execute(result, true);
    },
  },
  mounted() {
    (window as any).veloraFocus = () => {
      this.settings = false;
      this.pending = null;
      requestAnimationFrame(() => {
        const input = document.querySelector("#search-box") as HTMLInputElement;
        input?.focus();
        requestAnimationFrame(() => native()?.ui_ready());
      });
    };
    (window as any).veloraFocus();
    this.search();
  },
  beforeUnmount() {
    clearTimeout(this._timer);
    delete (window as any).veloraFocus;
  },
};
</script>
