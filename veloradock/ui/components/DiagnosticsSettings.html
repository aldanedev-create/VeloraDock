<template>
  <section>
    <p role="status">{{ message }}</p>
    <article>
      <h2>Shortcut and measurements</h2>
      <select v-model="hotkey" aria-label="Global shortcut"><option>Ctrl+Alt+Space</option><option>Ctrl+Shift+Space</option><option>Alt+Space</option></select>
      <button @click="saveHotkey">Save shortcut</button><button @click="measurements">Show measurements</button>
      <p>Shortcut changes need a restart. VeloraDock stays in the tray when closed. Choose Quit in the tray to exit.</p>
      <pre>{{ report }}</pre>
    </article>
  </section>
</template>
<script lang="ts">
import { request, native } from "../api.ts";

export default {
  props: ["token"],
  data() {
    return {
      state: {},
      message: "",
      hotkey: "Ctrl+Alt+Space",
      report: "",
    };
  },
  methods: {
    async load() {
      this.state = await request("/api/state", this.token);
      this.hotkey = this.state.hotkey;
    },
    async saveHotkey() {
      if (!native()) { this.message = "Use the Windows desktop app to configure global shortcuts."; return; }
      const reply = await native().set_hotkey(this.hotkey);
      this.message = reply.error || reply.message;
    },
    async measurements() {
      try {
        const data = await request("/api/metrics", this.token);
        const diagnostics = native() ? await native().diagnostics() : {};
        this.report = JSON.stringify({ ...diagnostics, ...data }, null, 2);
      } catch (error) { this.message = String(error); }
    },
  },
  async mounted() {
    try { await this.load(); }
    catch (error) { this.message = String(error); }
  },
};
</script>
