<template>
  <section>
    <p role="status">{{ message }}</p>
    <article>
      <h2>Extensions</h2><p>Paste a version-1 JSON manifest. Supports copy snippets, HTTPS bookmarks and references to registered actions. No downloaded plugin code executes.</p>
      <textarea v-model="manifest" rows="7" aria-label="Extension manifest"></textarea>
      <button @click="install">Review and install manifest</button>
      <ul><li v-for="extension in state.extensions" :key="extension.id">{{ extension.id }} <button @click="remove('extension', extension.id)">Remove</button></li></ul>
    </article>
  </section>
</template>
<script lang="ts">
import { request, native } from "../api.ts";

export default {
  props: ["token"],
  data() {
    return {
      state: { extensions: [] },
      message: "",
      manifest: '{"schema_version":1,"id":"my-shortcuts","name":"My shortcuts","entries":[{"id":"hello","title":"Hello snippet","keyword":"hello","kind":"copy","value":"Hello!"}]}',
      busy: false,
    };
  },
  methods: {
    async load() {
      this.state = await request("/api/state", this.token);
    },
    async perform(path: string, payload: object = {}) {
      this.busy = true;
      try {
        const result = await request(path, this.token, payload);
        this.message = JSON.stringify(result);
        await this.load();
      } catch (error) {
        this.message = String(error);
      } finally { this.busy = false; }
    },
    async install() {
      try {
        const value = JSON.parse(this.manifest);
        if (confirm(`Install extension ${value.name}? Review its entries first.`)) await this.perform("/api/extension", { manifest: value });
      } catch { this.message = "Enter valid JSON."; }
    },
    async remove(kind: string, id: string) { await this.perform("/api/remove", { kind, id }); },
  },
  async mounted() {
    try { await this.load(); }
    catch (error) { this.message = String(error); }
  },
};
</script>
