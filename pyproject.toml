[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "veloradock"
version = "1.0.1"
description = "A local keyboard launcher built with Flaxon and Teloce"
requires-python = ">=3.11"
dependencies = ["flaxon>=0.2.5", "teloce-py>=0.2.6", "minifyjs==0.1.3", "uvicorn>=0.30,<1", "pywebview>=6,<7", "pystray>=0.19,<1", "Pillow>=11,<13", "psutil>=6,<8"]
[project.scripts]
veloradock = "veloradock.desktop:main"
[tool.setuptools.packages.find]
include = ["veloradock*"]
[tool.setuptools.package-data]
veloradock = ["public/*.css", "public/*.svg", "public/*.png", "public/*.ico", "public/vendor/*", "ui/world/*.ts", "ui/*.html", "ui/*.ts", "ui/components/*.html"]
